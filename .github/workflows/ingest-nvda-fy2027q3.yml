name: ingest-nvda-fy2027q3

# 一次性：在 main 上重跑 NVDA FY2027Q3 Stage 1，并部署 Pages。
# github-pages 只允许 main，所以这次必须从 main 触发。
# 成功后删除本文件。
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ingest-nvda-fy2027q3.yml"

concurrency:
  group: earnings-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Restore LLM cache
        uses: actions/cache@v4
        with:
          path: cache/llm
          key: llm-cache-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            llm-cache-${{ runner.os }}-

      - name: Require OPENROUTER_API_KEY
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "::error::缺少 GitHub Secret OPENROUTER_API_KEY"
            exit 1
          fi

      - name: Stage 1 NVDA FY2027Q3
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          mkdir -p logs
          python -m pipeline run --ticker NVDA --stage 1 --period FY2027Q3 --accession 0001045810-26-000088 2>&1 | tee logs/manual.log
          python -m pipeline av-estimates --ticker NVDA 2>&1 | tee -a logs/manual.log || echo "::warning::EARNINGS_ESTIMATES 没有写入缓存"
          python -m pipeline build --ticker NVDA 2>&1 | tee -a logs/manual.log

      - name: Commit and push to main
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rm -f .github/workflows/ingest-nvda-fy2027q3.yml
          git add data site config
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: manual run NVDA FY2027Q3"
          git rebase origin/main
          git push origin HEAD:main
          git push origin HEAD:cursor/nvda-fy2027q3-ex99-754f
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvda-fy2027q3-logs
          path: logs/
          retention-days: 14
          if-no-files-found: ignore

  deploy:
    needs: ingest
    if: needs.ingest.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
