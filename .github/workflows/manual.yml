name: manual

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: Ticker
        required: true
        default: MU
      period:
        description: Fiscal period e.g. FY2026Q4
        required: false
      stage:
        description: Stage 1/2/3
        required: true
        default: "1"
      accession:
        description: Optional 8-K accession
        required: false

concurrency:
  group: earnings-pipeline
  cancel-in-progress: false

jobs:
  manual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ARGS=(--ticker "${{ inputs.ticker }}" --stage "${{ inputs.stage }}")
          if [ -n "${{ inputs.period }}" ]; then ARGS+=(--period "${{ inputs.period }}"); fi
          if [ -n "${{ inputs.accession }}" ]; then ARGS+=(--accession "${{ inputs.accession }}"); fi
          python -m pipeline run "${ARGS[@]}"
          python -m pipeline build --ticker "${{ inputs.ticker }}"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git add data site config || true
          git diff --staged --quiet || git commit -m "chore: manual ${{ inputs.ticker }} stage ${{ inputs.stage }}"
          git push
