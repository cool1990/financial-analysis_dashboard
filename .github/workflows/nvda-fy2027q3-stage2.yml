name: nvda-fy2027q3-stage2

# 一次性：main 上跑 NVDA FY2027Q3 Stage 2。github-pages 只允许从 main 部署。
# 成功后删除本文件。
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nvda-fy2027q3-stage2.yml"

concurrency:
  group: earnings-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  stage2:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Restore LLM cache
        uses: actions/cache@v4
        with:
          path: cache/llm
          key: llm-cache-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            llm-cache-${{ runner.os }}-

      - name: Require OPENROUTER_API_KEY
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "::error::缺少 GitHub Secret OPENROUTER_API_KEY"
            exit 1
          fi

      - name: Stage 2 NVDA FY2027Q3
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          mkdir -p logs
          python - <<'PY'
          import json
          from pathlib import Path
          doc = json.loads(Path("data/NVDA/FY2027Q3.json").read_text(encoding="utf-8"))
          fin = doc["financials"]
          rev = next(i for i in doc["guidance"]["items"] if i.get("metric_key") == "revenue" and "fourth" in str(i.get("period") or ""))
          Path("/tmp/nvda_stage1_guard.json").write_text(json.dumps({
              "revenue": fin["revenue"]["value"],
              "eps_gaap": fin["eps_gaap"]["value"],
              "eps_nongaap": fin["eps_nongaap"]["value"],
              "gm_gaap": fin["gross_margin_gaap"]["value"],
              "gm_ng": fin["gross_margin_nongaap"]["value"],
              "rev_guide": rev["mid"],
              "dc": (fin.get("kpis") or {}).get("data_center_revenue"),
          }), encoding="utf-8")
          PY
          python -m pipeline run --ticker NVDA --stage 2 --period FY2027Q3 2>&1 | tee logs/stage2.log
          python -m pipeline build --ticker NVDA 2>&1 | tee -a logs/stage2.log
          python - <<'PY'
          import json
          from pathlib import Path
          before = json.loads(Path("/tmp/nvda_stage1_guard.json").read_text(encoding="utf-8"))
          doc = json.loads(Path("data/NVDA/FY2027Q3.json").read_text(encoding="utf-8"))
          fin = doc["financials"]
          assert fin["revenue"]["value"] == before["revenue"]
          assert fin["eps_gaap"]["value"] == before["eps_gaap"]
          assert fin["eps_nongaap"]["value"] == before["eps_nongaap"]
          assert fin["gross_margin_gaap"]["value"] == before["gm_gaap"]
          assert fin["gross_margin_nongaap"]["value"] == before["gm_ng"]
          assert fin.get("kpis", {}).get("data_center_revenue") == before["dc"]
          rev = next(i for i in doc["guidance"]["items"] if i.get("metric_key") == "revenue" and "fourth" in str(i.get("period") or ""))
          assert rev["mid"] == before["rev_guide"]
          assert doc["status"]["stage"] == "stage2_done"
          assert doc["meta"].get("transcript_source") == "stockanalysis"
          items = doc["qa"]["items"]
          assert len(items) >= 8
          names = " ".join(str(i.get("analyst") or "") for i in items)
          for needle in ("Joseph", "Vivek", "Timothy", "Muse", "Stacy", "Ben", "Joshua", "Jim"):
              assert needle in names, needle
          assert all("Ian" not in str(i.get("analyst") or "") for i in items)
          page = Path("site/stocks/NVDA/index.html").read_text(encoding="utf-8")
          assert "等待文字稿" not in page
          assert "FY2027Q3" in page
          print("stage2 guard ok", len(items), names)
          PY

      - name: Commit and push to main
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rm -f .github/workflows/nvda-fy2027q3-stage2.yml
          git add data site config
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: manual stage2 NVDA FY2027Q3"
          if ! git rebase origin/main; then
            # poll 可能先写过「没有文字稿」。Stage 2 这一份覆盖 NVDA 季度和页面。
            git checkout --theirs -- data/NVDA/FY2027Q3.json data/market_brief.json site/stocks/NVDA/FY2027Q3.html site/stocks/NVDA/index.html
            git add data/NVDA/FY2027Q3.json data/market_brief.json site/stocks/NVDA/FY2027Q3.html site/stocks/NVDA/index.html
            GIT_EDITOR=true git rebase --continue
          fi
          git push origin HEAD:main
          git push origin HEAD:cursor/nvda-fy2027q3-stage2-754f
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvda-fy2027q3-stage2-logs
          path: logs/
          retention-days: 14
          if-no-files-found: ignore

  deploy:
    needs: stage2
    if: needs.stage2.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
