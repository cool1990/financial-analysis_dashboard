name: daily

on:
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch:
  # 注意：不使用 pull_request / pull_request_target，避免 fork PR 读取 secrets

concurrency:
  group: earnings-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt

      # daily 不调用 LLM：快照 → 近期季度 Stage3（股价反应 + T+1/3/7 修正）→ 建站
      - name: Snapshot + Stage3 refresh + build
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          set -euo pipefail
          mkdir -p logs
          # 新加的股票自动补 CIK 与业绩口径（只在缺 CIK 时请求 SEC）
          python -m pipeline init-missing 2>&1 | tee logs/daily_init.log
          python -m pipeline snapshot 2>&1 | tee logs/daily_snapshot.log
          python -m pipeline stage3-recent 2>&1 | tee logs/daily_stage3.log
          python -m pipeline build 2>&1 | tee logs/daily_build.log

      - name: Commit data/site
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 先提交流水线产物，再 rebase；否则 unstaged 改动会阻断 pull --rebase
          git add data site config || true
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: daily snapshot and site rebuild"
            git pull --rebase --autostash
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-logs
          path: logs/
          retention-days: 30
          if-no-files-found: ignore

  # GITHUB_TOKEN 推送的提交不会触发其它 workflow（含 deploy.yml 的 push 触发），
  # 所以在这里直接调用部署。
  deploy:
    needs: daily
    if: needs.daily.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
