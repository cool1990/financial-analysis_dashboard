<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>{% block title %}财报解读{% endblock %}</title>
  <link rel="stylesheet" href="{{ root }}static/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="{{ root }}index.html">财报解读</a>
      <nav class="nav" aria-label="股票">
        {% for n in nav %}
        <a href="{{ root }}{{ n.href }}"{% if n.ticker == active %} class="active"{% endif %}>{{ n.ticker }}</a>
        {% endfor %}
      </nav>
      {% block topbar_extra %}{% endblock %}
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>数据来源：SEC EDGAR / Yahoo Finance / 电话会文字稿。解读由模型生成并经原文引用校验，仅供研究参考，不构成投资建议。</footer>
  {% block scripts %}{% endblock %}
</body>
</html>
