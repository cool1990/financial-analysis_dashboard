# NYSE ADR（SEC FPI）。业绩发现走 6-K 新闻稿，不是 8-K Item 2.02。
# 不以 TWSE / us-gaap XBRL 为主路径。第二只 ADR 复制这份 sec 字段即可。
# eps_basis 保持 yaml 里的 gaap：ADR 初始化不拿 companyfacts 配对去改口径。
ticker: TSM
name: Taiwan Semiconductor Manufacturing (ADR)
name_zh: 台积电
cik: "0001046179"
listing: adr
fiscal_year_end_month: 12
release_timing: amc
reporting_currency: USD
accounting_basis: taiwan_ifrs
eps_basis: gaap
capex_definition: gross
benchmark: SOXX
kpis:
  - key: wafer_revenue_mix
    name: 制程节点晶圆收入占比
    unit: percent
    source: press_release
    hint: 各制程占晶圆收入的百分比（2nm/3nm/5nm/7nm，以及 7nm 及更先进合计）。这是占比不是金额；没有美元数字就不要填美元。
  - key: hpc_revenue
    name: 高性能计算营收
    unit: USD
    source: press_release
    hint: 仅当新闻稿明确给出 HPC 的美元金额时填写。只有占比、或没有 US$ 时留空，不要把百分比写进这个字段。

sec:
  earnings_forms: ["6-K"]
  earnings_items: []
  earnings_6k:
    require_exhibit_desc_any:
      - "(?i)press\\s*release"
      - "(?i)earnings"
    reject_exhibit_desc_any:
      - "(?i)consolidated\\s+financial\\s+statements"
      - "(?i)monthly\\s+revenue"
      - "(?i)dividend"
    reject_primary_doc_any:
      - "(?i)monthend"
      - "(?i)revenue20"
      - "(?i)dividend"
      - "(?i)board"
      - "(?i)agm"
      - "(?i)fsx"
    prefer_exhibit_desc: "(?i)press\\s*release"

transcript_sources:
  - motley_fool
  - ir_page
  - manual
webcast_audio_url: null
management_aliases: []
ir_transcript_url: null
ir_transcript_match: (?i)transcript|prepared.?remarks
ir_prepared_remarks_url: null
