llm:
  provider: openrouter
  model: "deepseek/deepseek-v4-pro-0813"
  temperature: 0
  base_url: "https://openrouter.ai/api/v1"
  max_retries: 1
  # 限制单次输出，避免模型啰嗦写出上万 token（实测可单次 5–6 分钟）
  max_tokens: 4096
  # 推理模型的思考 token 计入 max_tokens 且计费。实测 low 档对 DeepSeek V4 Pro 无效
  # （它只支持 high / xhigh），思考耗尽 4096 额度后正文为空。抽取、摘要和问答不需要推理，默认关闭。
  # 可选：off（关闭，最省）/ high / xhigh；删掉这一行则沿用模型默认
  reasoning_effort: "off"
  # 问答、摘要、指引、变动原因、行业展望用同一个 DeepSeek。留空则回退到上面的 model。
  # 行业展望在 Stage2 读取 prompts/extract_industry_outlook.md，这一步单独把输出上限放到 8192，
  # 避免六题展开被全局 4096 截断。页面只渲染这次写入的 guidance.industry_outlook。
  # 变动原因要覆盖整张指标表。0700 FY2026Q1 的中文电话会在 4096 上被截断
  # （completion_tokens=4096，正文约 1.2 万字且 JSON 不完整）。这一步单独放宽；
  # 仍截断时按指标拆开，每次都要完整 JSON，再合并。不要把截断的半截写入 drivers。
  drivers_max_tokens: 16384
  drivers_request_timeout_sec: 240
  # 不单独设 qa_reasoning_effort / qa_max_tokens：沿用 reasoning_effort=off 和 max_tokens=4096。
  # DeepSeek V4 Pro 不支持 low；打开思考会耗尽 4096，正文为空。
  qa_model: "deepseek/deepseek-v4-pro-0813"
  # 整次请求墙钟上限（含流式吐字）；httpx read timeout 会随 chunk 重置，不能单靠它
  request_timeout_sec: 90
  max_cost_per_run_usd: 2
  # 单价拿不到时金额上限会失效，token 上限始终生效（输入+输出合计）
  max_tokens_per_run: 600000
  # 单轮累计超时达到此次数即熔断：超时的请求在服务端仍会计费
  max_timeouts_per_run: 2
  # Stage1 仅凭新闻稿先做一版「变动原因」（约 1 次调用），Stage2 会用文字稿重算覆盖；false 可省掉
  stage1_drivers: true

thresholds:
  revenue_inline_pct: 0.01
  eps_inline_pct: 0.02
  eps_inline_abs: 0.01
  margin_inline_pp: 0.5
  guidance_change_pct: 0.005
  guidance_change_pp: 0.25

validation:
  eps_provider_tolerance: 0.02
  snapshot_max_age_days: 3
  min_analysts: 3
  quote_similarity: 0.9

polling:
  amc_window_et: ["16:00", "20:00"]
  bmo_window_et: ["06:00", "09:30"]
  transcript_max_hours: 36
  # 仅处理发布不超过 N 天的 8-K；更早的历史季度走 backfill，避免 poll 逐份回溯烧 LLM
  new_filing_max_age_days: 4
  # 同一份 8-K Stage1 连续失败达到此次数后 poll 不再自动重试
  max_retries: 3
  # Stage3（次日股价反应 + T+1/3/7 分析师修正）已停用；stage3-recent 为空操作

sec:
  max_rps: 5
  max_retries: 3
  # ADR 6-K 过滤的代码默认值见 pipeline/earnings_config.py。
  # 要同时改多只 ADR：在 earnings_6k_profiles 里写同名 profile（例如 adr），
  # 它会覆盖股票 yaml 里 sec.earnings_6k 的同名键。未配置时各票用自己的 yaml。
  # earnings_6k_profiles: {}

paths:
  data: data
  site: site
  cache: cache
  logs: logs
  config: config
  prompts: prompts

# 增长质量 · 通用层：只放会计质量类检查。各股票在 config/tickers/*.yaml 的
# quality_checks 里写公司层检查；写了同一个 key 就覆盖这里的阈值。
# 可用指标见 pipeline/compute/derived.py 的 METRICS。
quality:
  defaults:
    - {key: cash_conversion, op: ">=", value: 0.8, note: 看利润能否转成现金}
    - {key: gaap_gap, op: "<=", value: 0.10, note: 调整项过大时要看剔除了什么}
