# 0700.HK 仓位档案。阶段：观察 / 等待 / 持仓
阶段: 持仓
更新: 2026-10-23

论点:
  - 看好: 增值服务、营销服务、金融科技及企业服务仍是合并收入的主体
    担心: AI 投入推高资本开支后，非国际财务报告准则经营利润率未必跟着收入走
    证伪: 这三项收入同时同比下降
  - 看好: 业绩公告按人民币、单季三个月披露，口径可以和历史季对齐
