# MU 投资论点 · 草稿（待你确认；Stage2 和 manual → thesis 会读取本文件评估）
#
# 每条论点四件事：市场担心什么、你为什么看好、什么算证实 / 证伪、到什么时候验证。
# 依据：MU FY2026Q4 新闻稿、管理层发言与电话会问答（2026-09-30 发布）。
# 「市场担心」优先取自分析师在电话会上追问的点，那是现成数据里最接近市场顾虑的信号。
# 证实 / 证伪尽量写成可以用数字判断的条件，metric 填了的会由程序自动核对，
# 其余由模型在每季总结时对照原文判断并给出引用。
#
# 字段：
#   name        论点名称
#   bull        我为什么看好
#   bear        市场担心什么（及来源）
#   confirm     证实条件（满足越多，论点越强）
#   falsify     证伪条件（出现任一条就要重新评估）
#   deadline    最晚在什么时点能看出结果
#   metric      可自动核对的条件（可选）：key / op / value，可用指标见 pipeline/compute/derived.py；
#               写了 period 的只用那个财季的实际数据核对（之前显示「待验证」），不写则每季核对

ticker: MU
updated: 2026-10-02
status: draft

theses:
  - id: hbm_ai_demand
    name: AI / HBM 需求持续大于供给
    bull: >-
      AI 服务器拉动 HBM 和高容量 DRAM，管理层已大幅上调 2027 日历年 HBM 定价，
      FY2027 超过 75% 出货通过客户分配或合同锁定，需求能见度到 2027 年底。
    bear: >-
      AI 资本开支周期见顶，云厂商放缓采购后 HBM 转为过剩；HBM 总规模（TAM）
      本季没有更新，增长中价格贡献多、位元贡献少（Melissa Weathers 追问）。
    confirm:
      - FQ1-27 营收达到或超过指引中值 $61.5B
      - 管理层维持或上调 HBM 份额目标（与公司整体 DRAM 份额相当）
      - 更新的 HBM TAM 高于上一次披露
    falsify:
      - FQ1-27 营收低于指引下限 $60.0B
      - HBM 定价下调，或客户推迟提货、调整合同量
    deadline: FQ1-27 财报（预计 2026-12-23）
    metric:
      - {key: revenue, op: ">=", value: 61500000000, period: FY2027Q1, note: 营收不低于本季给出的指引中值}

  - id: supply_discipline
    name: 行业供给受限，周期被拉长
    bull: >-
      洁净室空间是全行业约束，新洁净室 2028 日历年下半年才投产；技术节点的位元
      回报递减、HBM4/4E 换代提高晶圆消耗，供给增速被压住，管理层认为 2028 年比 2027 年更紧。
    bear: >-
      存储是强周期行业，资本开支环比 +42% 且趋势延续到 2027 年以后，全行业同时扩产，
      2028 年新产能集中释放后重回过剩（Joseph Moore、Christopher Caso 追问）。
    confirm:
      - 管理层继续表述「供需紧张延续到 2028 年」
      - 行业 DRAM 位元供给增速低于需求增速
    falsify:
      - 管理层下修供需判断，或改口「供需趋于平衡」
      - 主要竞争对手宣布超预期扩产，或合约价出现环比下跌
    deadline: FY2027 每季核对；关键窗口为 2028 下半年新洁净室投产前

  - id: margin_durability
    name: 利润率维持高位
    bull: >-
      定价权和长约支撑毛利率在 87% 附近；管理层预计 FY2027 余下季度利润率相对一季度扩张，
      动力是价格温和上涨和产品组合改善。
    bear: >-
      FQ1-27 Non-GAAP 毛利率指引 86.25%，低于本季 87.05%，可能是利润率见顶的信号；
      FY2027 研发支出增加超过 10 亿美元，进一步压缩利润率弹性。
    confirm:
      - FQ1-27 实际 Non-GAAP 毛利率不低于 86.25%
      - FQ2-27 指引毛利率重新高于 FQ1-27
    falsify:
      - 连续两个季度毛利率指引环比下降
      - 管理层提到价格松动或产品组合转差
    deadline: FQ2-27 财报（预计 2027-03）
    metric:
      - {key: gross_margin_nongaap, op: ">=", value: 0.8625, period: FY2027Q1, note: 毛利率不低于本季给出的指引中值}

  - id: contract_visibility
    name: 长约让盈利更可预期
    bull: >-
      26 项战略客户协议锁定到 2030 年约 35% 的位元产量，周期股的盈利能见度明显提高，
      估值框架有机会从「周期顶部打折」转向「可持续盈利」。
    bear: >-
      长约带价格上下限，市场上行时可能限制涨价空间，下行时客户未必履约；
      分析师追问上下限是否已按当前更高价格重置（James Schneider 追问）。
    confirm:
      - 新增战略协议，或披露价格机制对公司有利（下限能提供保护）
      - 下行压力出现时，长约量与价得到执行
    falsify:
      - 客户要求重谈或减少合同量
      - 管理层持续回避价格条款细节
    deadline: FY2027 内

  - id: capex_returns
    name: 资本开支换来回报
    bull: >-
      扩产对应的是有合同支撑的结构性需求，本季自由现金流占营收 61%、
      占净利润 87%，投入期内现金创造仍然很强。
    bear: >-
      资本开支增速快于营收（环比 +42% vs +31%），且趋势延续到 2027 年以后，
      若需求放缓，自由现金流会被快速侵蚀。
    confirm:
      - 资本开支 / 营收维持在 25% 以下，同时营收继续增长
    falsify:
      - 资本开支 / 营收超过 30%，且营收环比转为下滑
    deadline: FY2027 每季核对
    metric:
      - {key: capex_to_revenue, op: "<=", value: 0.25, note: 资本开支占营收不超过 25%}
