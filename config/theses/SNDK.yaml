# SNDK 仓位档案（草稿，请按你的真实判断修改）。阶段：观察 / 等待 / 持仓
# 持仓：写论点和加仓 / 卖出条件。每条论点三行：看好、担心、证伪；
# 证伪里写上日期（YYYY-MM-DD）页面会显示倒计时。
阶段: 持仓
更新: 2026-10-02

论点:
  - 看好: AI 数据中心带动企业级 SSD 需求，NAND 供需偏紧、价格上行
    担心: NAND 是强周期，行业扩产后价格回落
    证伪: 毛利率指引连续两个季度环比下降，或管理层表示 NAND 价格转跌
  - 看好: 独立上市后专注 NAND，企业级 SSD 份额和利润率提升
    担心: 企业级市场竞争激烈，份额提升慢于预期
    证伪: 数据中心收入连续两个季度环比下滑

条件:
  加仓: 【请填写】例如：论点未削弱且股价较持仓成本回调 15% 以上
  卖出: 任一证伪条件出现；或【请填写】目标价 / 估值上限
